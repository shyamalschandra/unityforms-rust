[package]
name = "unityform-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Cross-platform shell: Win32 HWND on Windows, portable winit+softbuffer on macOS/Linux/BSD"

[dependencies]
unityform-core = { path = "../unityform-core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
raw-window-handle = "0.6.2"
softbuffer = "0.4.8"
winit = "0.29.15"
